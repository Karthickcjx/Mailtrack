<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>P1/P3 spike</title>
<style>body{font:12px system-ui;width:420px;margin:10px}button{margin:2px}input{width:100%;box-sizing:border-box;margin:4px 0}pre{white-space:pre-wrap;background:#f4f4f4;padding:6px;max-height:380px;overflow:auto}</style>
</head><body>
<b>P1 OAuth (getAuthToken)</b><br>
<button id="signin">P1.2 Sign in (interactive)</button>
<button id="silent">P1.3 Silent token</button>
<button id="clear">P1.5 Remove cached</button>
<button id="profile">Profile info</button>
<button id="accounts">List accounts</button>
<input id="acct" placeholder="P1.4 account id (gaia id) — optional">
<button id="account">P1.4 Token for account</button>
<button id="revoke">P1.7 Revoke</button>
<hr><b>P3 MIME send (your own test addresses only, 1–3, comma-separated)</b>
<input id="rcpts" placeholder="second.test@gmail.com, second.test+cc@gmail.com, second.test+bcc@gmail.com">
<button id="p3send">P3.2 Send test copies</button>
<pre id="out"></pre>
<script type="module" src="popup.js"></script>
</body></html>
